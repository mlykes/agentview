<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentview</title>
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128065;</text></svg>">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>agentview</h1>
  </div>
  <div class="totals" id="totals"></div>
  <div class="launch" id="launch" hidden>
    <button class="launch-btn" id="launch-btn">+ new agent</button>
    <div class="launch-menu" id="launch-menu" hidden></div>
  </div>
  <div class="conn" id="conn"><span class="conn-dot"></span><span id="conn-text">connecting</span></div>
</header>

<main id="root">
  <div class="empty" id="boot">Loading…</div>
</main>

<footer class="footer">
  <span id="footer-note">Presence is read from each harness on disk. Agents started with
  <b>+ new agent</b> run under tmux and open a live terminal here; agents started elsewhere
  can be watched but not attached to, since a PTY cannot be added to a running process.</span>
</footer>

<div class="term-overlay" id="term-overlay" hidden>
  <div class="term-panel">
    <div class="term-head">
      <span class="term-dot" id="term-dot"></span>
      <span class="term-title" id="term-title">terminal</span>
      <span class="term-sub" id="term-sub"></span>
      <span class="term-state" id="term-state"></span>
      <button class="term-close" id="term-close" title="close (esc)">&times;</button>
    </div>
    <div class="term-body" id="term-body"></div>
    <div class="term-foot" id="term-foot">connecting…</div>
  </div>
</div>

<!--BOOTSTRAP-->
<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
